{% extends "base.html" %}

{% block title %}Supprimer depense{% endblock %}
{% block page_title %}Suppression depense{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl ui-card p-8 text-center">
  <p class="text-slate-700">
    Etes-vous sur de vouloir supprimer <strong>{{ expense.title }}</strong>
    pour <strong>{{ expense.amount }} FCFA</strong> ?
  </p>

  <form method="POST" class="mt-6 flex justify-center gap-2">
    {% csrf_token %}
    <a href="{% url 'expenses:expense_list' %}" class="ui-btn ui-btn-muted">Annuler</a>
    <button type="submit" class="ui-btn ui-btn-danger">Supprimer</button>
  </form>
</div>
{% endblock %}
