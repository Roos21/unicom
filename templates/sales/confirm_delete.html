{% extends 'base.html' %}
{% block page_title %}Confirmation de suppression{% endblock %}

{% block content %}
<div class="mx-auto mt-12 max-w-lg ui-card p-6 text-center">
  <h2 class="text-xl font-semibold text-slate-900">Etes-vous sur de vouloir supprimer ?</h2>
  <p class="mt-2 text-slate-600">{{ object }}</p>

  <form method="POST" class="mt-6 flex justify-center gap-2">
    {% csrf_token %}
    <a href="{{ cancel_url }}" class="ui-btn ui-btn-muted">Annuler</a>
    <button type="submit" class="ui-btn ui-btn-danger">Supprimer</button>
  </form>
</div>
{% endblock %}
