{% extends "base.html" %}

{% block title %}Suppression antenne{% endblock %}
{% block page_title %}Suppression antenne{% endblock %}

{% block content %}
<div class="mx-auto mt-12 max-w-lg ui-card p-6 text-center">
  <h2 class="text-xl font-bold text-slate-900">Confirmer la suppression</h2>
  <p class="mt-3 text-slate-600">Supprimer l'antenne <strong>{{ antenna.nom|default:"Sans nom" }}</strong> ?</p>
  <form method="post" class="mt-6 flex justify-center gap-2">
    {% csrf_token %}
    <button type="submit" class="ui-btn ui-btn-danger">Supprimer</button>
    <a href="{% url 'accounts:antenna_list' %}" class="ui-btn ui-btn-muted">Annuler</a>
  </form>
</div>
{% endblock %}
