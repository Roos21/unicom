{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl ui-card p-6">
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="flex flex-wrap justify-end gap-2 pt-3">
      <a href="{% url 'accounts:user_list' %}" class="ui-btn ui-btn-muted">Annuler</a>
      <button type="submit" class="ui-btn ui-btn-primary">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
